<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="style.css" rel="stylesheet" media="screen"> <!-- untuk tampilan layar -->
    <link href="print.css" rel="stylesheet" media="print"> <!-- untuk media cetak -->


</head>
<body>
    <h1>CSS Media Type</h1>
    <h2>penjelasan tambahan</h2>
    <p>Dengan media type, kita bisa mengatur di media atau perangkat manakah style CSS tersebut akan berjalan. CSS mendukung berbagai jenis media, seperti ‘screen’ untuk jenis perangkat yang menggunakan layar (screen), atau ‘print’ untuk perangkat mesin cetak (print).</p>
</body>
</html>
